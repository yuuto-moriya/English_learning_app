# Cloudflare Pages プロジェクト設定（Wrangler 設定ファイル）
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# - Pages プロジェクトでは name / pages_build_output_dir / compatibility_date が必須。
# - このファイルを使うと、ここに書いた項目はダッシュボード上で「表示のみ（編集不可）」になる（このファイルが正）。
# - API キー等の秘密情報はここに書かない（[vars] は平文）。本番はダッシュボードの
#   Settings > Variables and Secrets で「Encrypt」して登録するか、
#   `npx wrangler pages secret put AZURE_TRANSLATOR_KEY --project-name tetsu-english` で登録する。
# - ローカルでは .dev.vars を使う（.dev.vars.example を参照）。

name = "tetsu-english"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
